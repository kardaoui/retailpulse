name: olist_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint
run_name_template: "%Y%m%d-%H%M%S-olist"

validations:
  - batch_request:
      datasource_name: retailpulse_postgres
      data_connector_name: default_inferred_data_connector_name
      data_asset_name: raw.orders
    expectation_suite_name: olist_orders_suite

  - batch_request:
      datasource_name: retailpulse_postgres
      data_connector_name: default_inferred_data_connector_name
      data_asset_name: raw.payments
    expectation_suite_name: olist_payments_suite

  - batch_request:
      datasource_name: retailpulse_postgres
      data_connector_name: default_inferred_data_connector_name
      data_asset_name: raw.reviews
    expectation_suite_name: olist_reviews_suite
